<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 使用示例</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #4ec9b0;
      margin-bottom: 30px;
      font-size: 2rem;
    }
    h2 {
      color: #569cd6;
      margin-top: 30px;
      margin-bottom: 15px;
    }
    .endpoint {
      background: #252526;
      border-left: 4px solid #007acc;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 4px;
    }
    .method {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 3px;
      font-weight: bold;
      margin-right: 10px;
      font-size: 0.9rem;
    }
    .method.get { background: #4caf50; color: white; }
    .method.post { background: #ff9800; color: white; }
    .method.delete { background: #f44336; color: white; }
    .url {
      color: #ce9178;
      font-size: 1.1rem;
    }
    .description {
      margin-top: 10px;
      color: #b5cea8;
    }
    .code-block {
      background: #1e1e1e;
      border: 1px solid #3c3c3c;
      padding: 15px;
      margin-top: 10px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 0.9rem;
    }
    .test-button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 4px;
      font-family: inherit;
    }
    .test-button:hover {
      background: #1177bb;
    }
    .result {
      background: #252526;
      border: 1px solid #4ec9b0;
      padding: 15px;
      margin-top: 10px;
      border-radius: 4px;
      display: none;
    }
    .result.show {
      display: block;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .stat-card {
      background: #252526;
      padding: 20px;
      border-radius: 4px;
      border-left: 4px solid #4ec9b0;
    }
    .stat-value {
      font-size: 2rem;
      color: #4ec9b0;
      font-weight: bold;
    }
    .stat-label {
      color: #858585;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📡 API 使用示例</h1>

    <div id="stats-section">
      <h2>系统统计</h2>
      <div class="stats-grid" id="statsGrid"></div>
      <button class="test-button" onclick="loadStats()">刷新统计</button>
    </div>

    <h2>API 接口测试</h2>

    <!-- 获取所有资源 -->
    <div class="endpoint">
      <div>
        <span class="method get">GET</span>
        <span class="url">/api/resources</span>
      </div>
      <div class="description">获取所有资源列表</div>
      <button class="test-button" onclick="testAPI('resources', 'GET')">测试接口</button>
      <div class="result" id="result-resources"></div>
    </div>

    <!-- 根据类型获取资源 -->
    <div class="endpoint">
      <div>
        <span class="method get">GET</span>
        <span class="url">/api/resources/type/image</span>
      </div>
      <div class="description">获取图片类型的资源</div>
      <button class="test-button" onclick="testAPI('resources/type/image', 'GET')">测试接口</button>
      <div class="result" id="result-resources-type-image"></div>
    </div>

    <!-- 搜索资源 -->
    <div class="endpoint">
      <div>
        <span class="method get">GET</span>
        <span class="url">/api/search?q=example</span>
      </div>
      <div class="description">搜索包含关键词的资源</div>
      <button class="test-button" onclick="testAPI('search?q=example', 'GET')">测试接口</button>
      <div class="result" id="result-search-q-example"></div>
    </div>

    <!-- 添加爬取任务 -->
    <div class="endpoint">
      <div>
        <span class="method post">POST</span>
        <span class="url">/api/crawl</span>
      </div>
      <div class="description">添加新的爬取任务</div>
      <div class="code-block">
{
  "url": "http://example.com",
  "type": "image"
}</div>
      <button class="test-button" onclick="testCrawl()">测试接口</button>
      <div class="result" id="result-crawl"></div>
    </div>

    <!-- 获取爬取历史 -->
    <div class="endpoint">
      <div>
        <span class="method get">GET</span>
        <span class="url">/api/history?limit=10</span>
      </div>
      <div class="description">获取最近10条爬取历史</div>
      <button class="test-button" onclick="testAPI('history?limit=10', 'GET')">测试接口</button>
      <div class="result" id="result-history-limit-10"></div>
    </div>

    <!-- 获取统计信息 -->
    <div class="endpoint">
      <div>
        <span class="method get">GET</span>
        <span class="url">/api/stats</span>
      </div>
      <div class="description">获取系统统计信息</div>
      <button class="test-button" onclick="testAPI('stats', 'GET')">测试接口</button>
      <div class="result" id="result-stats"></div>
    </div>
  </div>

  <script>
    const BASE_URL = 'http://localhost:3000/api';

    async function testAPI(endpoint, method = 'GET', body = null) {
      const resultId = 'result-' + endpoint.replace(/[?=/]/g, '-');
      const resultEl = document.getElementById(resultId);

      resultEl.innerHTML = '<pre>⏳ 请求中...</pre>';
      resultEl.classList.add('show');

      try {
        const options = {
          method: method,
          headers: {
            'Content-Type': 'application/json'
          }
        };

        if (body) {
          options.body = JSON.stringify(body);
        }

        const response = await fetch(`${BASE_URL}/${endpoint}`, options);
        const data = await response.json();

        resultEl.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
      } catch (error) {
        resultEl.innerHTML = '<pre style="color: #f44336;">❌ 错误: ' + error.message + '</pre>';
      }
    }

    async function testCrawl() {
      const resultEl = document.getElementById('result-crawl');

      resultEl.innerHTML = '<pre>⏳ 添加任务中...</pre>';
      resultEl.classList.add('show');

      try {
        const response = await fetch(`${BASE_URL}/crawl`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            url: 'http://example.com',
            type: 'image'
          })
        });

        const data = await response.json();
        resultEl.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';

        // 刷新统计
        setTimeout(() => loadStats(), 3000);
      } catch (error) {
        resultEl.innerHTML = '<pre style="color: #f44336;">❌ 错误: ' + error.message + '</pre>';
      }
    }

    async function loadStats() {
      try {
        const response = await fetch(`${BASE_URL}/stats`);
        const result = await response.json();
        const stats = result.data;

        const statsGrid = document.getElementById('statsGrid');
        statsGrid.innerHTML = `
          <div class="stat-card">
            <div class="stat-value">${stats.total_crawls}</div>
            <div class="stat-label">总爬取次数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${stats.success_crawls}</div>
            <div class="stat-label">成功次数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${stats.failed_crawls}</div>
            <div class="stat-label">失败次数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${stats.total_downloads}</div>
            <div class="stat-label">总下载数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${(stats.total_size / 1024 / 1024).toFixed(2)} MB</div>
            <div class="stat-label">总下载大小</div>
          </div>
        `;
      } catch (error) {
        console.error('加载统计失败:', error);
      }
    }

    // 页面加载时获取统计信息
    loadStats();
  </script>
</body>
</html>
